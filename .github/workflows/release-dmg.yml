name: Release DMG

# Builds an ad-hoc signed (not notarized) MeetingBar.app, packages it as a
# .dmg and attaches it to a GitHub release. Intended for local installs of a
# fork; it does not use the upstream Developer ID / App Store signing.
on:
  push:
    tags:
      - 'v*'
    # Fork builds: every push to this branch publishes a numbered pre-release.
    branches:
      - 'claude/adoring-babbage-1zodhp'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v5.0.0-local.1)'
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

jobs:
  build-dmg:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v5.0.1-local.$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build app (Release, ad-hoc signed)
        env:
          # Optional: set these repository secrets to enable Google Calendar sign-in.
          GOOGLE_CLIENT_NUMBER: ${{ secrets.GOOGLE_CLIENT_NUMBER }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          google_settings=()
          if [ -n "${GOOGLE_CLIENT_NUMBER:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            google_settings=(
              GOOGLE_CLIENT_NUMBER="$GOOGLE_CLIENT_NUMBER"
              GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
              GOOGLE_AUTH_KEYCHAIN_NAME="com.alwerdani.MeetingBar.google-auth"
            )
          else
            echo "::warning::GOOGLE_CLIENT_NUMBER/GOOGLE_CLIENT_SECRET not set; Google Calendar sign-in is disabled in this build."
          fi

          mkdir -p build
          # Ad-hoc signatures cannot carry restricted entitlements such as
          # time-sensitive notifications, so sign with a trimmed copy.
          cp MeetingBar/MeetingBar.entitlements build/Local.entitlements
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.usernotifications.time-sensitive" build/Local.entitlements || true

          set -o pipefail
          xcodebuild \
            -project MeetingBar.xcodeproj \
            -scheme MeetingBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS="$PWD/build/Local.entitlements" \
            "${google_settings[@]}" \
            build

      - name: Create DMG
        run: |
          app="build/DerivedData/Build/Products/Release/MeetingBar.app"
          test -d "$app"

          # LaunchAtLogin's copy-helper script edits the embedded helper's
          # Info.plist after Xcode signed it, which invalidates the signature
          # ("MeetingBar is damaged"). Re-sign inside-out: nested code first,
          # keeping each one's entitlements, then the app itself.
          find "$app/Contents" -depth \( -name "*.app" -o -name "*.framework" -o -name "*.xpc" -o -name "*.dylib" \) -print0 |
            while IFS= read -r -d '' nested; do
              codesign --force --sign - --timestamp=none \
                --preserve-metadata=identifier,entitlements,flags "$nested"
            done
          codesign --force --sign - --timestamp=none \
            --entitlements build/Local.entitlements "$app"

          codesign --verify --deep --strict --verbose=2 "$app"

          staging="build/dmg"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "MeetingBar" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "build/MeetingBar.dmg"

      - name: Smoke test app launch
        run: |
          # Install from the DMG exactly like a user would, then launch and
          # make sure the process stays alive.
          mount_dir=$(mktemp -d)
          hdiutil attach build/MeetingBar.dmg -nobrowse -mountpoint "$mount_dir"
          rm -rf /Applications/MeetingBar.app
          cp -R "$mount_dir/MeetingBar.app" /Applications/
          hdiutil detach "$mount_dir"

          codesign -dv --verbose=2 /Applications/MeetingBar.app 2>&1 || true
          spctl -a -vv /Applications/MeetingBar.app 2>&1 || true

          /Applications/MeetingBar.app/Contents/MacOS/MeetingBar > build/launch.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "MeetingBar is still running after 20s"
            kill "$pid" || true
            status=0
          else
            wait "$pid"; code=$?
            echo "::error::MeetingBar exited during launch (exit code $code)"
            status=1
          fi
          echo "----- app output -----"
          tail -100 build/launch.log || true
          echo "----- crash reports -----"
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i meetingbar | head -1 |
            while read -r report; do head -80 ~/Library/Logs/DiagnosticReports/"$report"; done
          echo "----- system log -----"
          log show --last 2m --style compact \
            --predicate 'process == "MeetingBar" OR eventMessage CONTAINS "MeetingBar"' | tail -60 || true
          exit $status

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeetingBar-dmg
          path: build/MeetingBar.dmg
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/MeetingBar.dmg --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/MeetingBar.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MeetingBar $TAG" \
              --prerelease \
              --notes "Local build (ad-hoc signed, not notarized). After copying MeetingBar.app to Applications, run: /usr/bin/xattr -dr com.apple.quarantine /Applications/MeetingBar.app"
          fi
