name: Release DMG

# Builds MeetingBar.app, packages it as a .dmg and attaches it to a GitHub
# release.
#
# With these repository secrets set, the app is signed with a Developer ID
# certificate and the DMG is notarized, so it opens on any Mac:
#   MACOS_CERT_P12_BASE64  base64 of the exported "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD    password of that .p12
#   APPLE_TEAM_ID          10-character team ID
#   APPLE_ID               Apple ID email used for notarization
#   APPLE_APP_PASSWORD     app-specific password for that Apple ID
# Without them the build is ad-hoc signed and needs the quarantine flag removed.
on:
  push:
    tags:
      - 'v*'
    # Fork builds: every push to this branch publishes a numbered pre-release.
    branches:
      - 'claude/adoring-babbage-1zodhp'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v5.0.0-local.1)'
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

jobs:
  build-dmg:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v5.0.1-local.$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "::warning::MACOS_CERT_P12_BASE64 not set; building an ad-hoc signed, non-notarized DMG."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity found in MACOS_CERT_P12_BASE64."
            exit 1
          fi
          echo "Signing with: $identity"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APPLE_ID/APPLE_APP_PASSWORD/APPLE_TEAM_ID not set; skipping notarization."
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app (Release)
        env:
          # Optional: set these repository secrets to enable Google Calendar sign-in.
          GOOGLE_CLIENT_NUMBER: ${{ secrets.GOOGLE_CLIENT_NUMBER }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          google_settings=()
          if [ -n "${GOOGLE_CLIENT_NUMBER:-}" ] && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            google_settings=(
              GOOGLE_CLIENT_NUMBER="$GOOGLE_CLIENT_NUMBER"
              GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
              GOOGLE_AUTH_KEYCHAIN_NAME="com.alwerdani.MeetingBar.google-auth"
            )
          else
            echo "::warning::GOOGLE_CLIENT_NUMBER/GOOGLE_CLIENT_SECRET not set; Google Calendar sign-in is disabled in this build."
          fi

          mkdir -p build
          # Ad-hoc signatures cannot carry restricted entitlements such as
          # time-sensitive notifications, so sign with a trimmed copy.
          cp MeetingBar/MeetingBar.entitlements build/Local.entitlements
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.usernotifications.time-sensitive" build/Local.entitlements || true

          set -o pipefail
          xcodebuild \
            -project MeetingBar.xcodeproj \
            -scheme MeetingBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_ENTITLEMENTS="$PWD/build/Local.entitlements" \
            "${google_settings[@]}" \
            build

      - name: Sign app and create DMG
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          app="build/DerivedData/Build/Products/Release/MeetingBar.app"
          test -d "$app"

          # LaunchAtLogin's copy-helper script edits the embedded helper's
          # Info.plist after Xcode signed it, which invalidates the signature
          # ("MeetingBar is damaged"). Re-sign inside-out: nested code first,
          # keeping each one's entitlements, then the app itself.
          # With a Developer ID, notarization also requires the hardened
          # runtime and a secure timestamp on every signed binary.
          if [ "$IDENTITY" = "-" ]; then
            sign_flags=(--timestamp=none)
          else
            sign_flags=(--options runtime --timestamp)
          fi
          find "$app/Contents" -depth \( -name "*.app" -o -name "*.framework" -o -name "*.xpc" -o -name "*.dylib" \) -print0 |
            while IFS= read -r -d '' nested; do
              codesign --force --sign "$IDENTITY" "${sign_flags[@]}" \
                --preserve-metadata=identifier,entitlements,flags "$nested"
            done
          codesign --force --sign "$IDENTITY" "${sign_flags[@]}" \
            --entitlements build/Local.entitlements "$app"

          codesign --verify --deep --strict --verbose=2 "$app"

          staging="build/dmg"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "MeetingBar" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "build/MeetingBar.dmg"

          if [ "$IDENTITY" != "-" ]; then
            codesign --force --sign "$IDENTITY" --timestamp build/MeetingBar.dmg
          fi

      - name: Notarize DMG
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit build/MeetingBar.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 30m --output-format json | tee build/notary.json
          status=$(/usr/bin/python3 -c 'import json;print(json.load(open("build/notary.json"))["status"])')
          if [ "$status" != "Accepted" ]; then
            id=$(/usr/bin/python3 -c 'import json;print(json.load(open("build/notary.json"))["id"])')
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
            echo "::error::Notarization status: $status"
            exit 1
          fi
          xcrun stapler staple build/MeetingBar.dmg
          xcrun stapler validate build/MeetingBar.dmg

      - name: Smoke test app launch
        run: |
          # Install from the DMG exactly like a user would, then launch and
          # make sure the process stays alive.
          mount_dir=$(mktemp -d)
          hdiutil attach build/MeetingBar.dmg -nobrowse -mountpoint "$mount_dir"
          rm -rf /Applications/MeetingBar.app
          cp -R "$mount_dir/MeetingBar.app" /Applications/
          hdiutil detach "$mount_dir"

          codesign -dv --verbose=2 /Applications/MeetingBar.app 2>&1 || true
          spctl -a -vv /Applications/MeetingBar.app 2>&1 || true

          /Applications/MeetingBar.app/Contents/MacOS/MeetingBar > build/launch.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "MeetingBar is still running after 20s"
            kill "$pid" || true
            status=0
          else
            wait "$pid"; code=$?
            echo "::error::MeetingBar exited during launch (exit code $code)"
            status=1
          fi
          echo "----- app output -----"
          tail -100 build/launch.log || true
          echo "----- crash reports -----"
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i meetingbar | head -1 |
            while read -r report; do head -80 ~/Library/Logs/DiagnosticReports/"$report"; done
          echo "----- system log -----"
          log show --last 2m --style compact \
            --predicate 'process == "MeetingBar" OR eventMessage CONTAINS "MeetingBar"' | tail -60 || true
          exit $status

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeetingBar-dmg
          path: build/MeetingBar.dmg
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          if [ "$NOTARIZED" = "true" ]; then
            notes="Signed with Developer ID and notarized by Apple. Open the DMG and drag MeetingBar to Applications."
          else
            notes="Local build (ad-hoc signed, not notarized). After copying MeetingBar.app to Applications, run: /usr/bin/xattr -dr com.apple.quarantine /Applications/MeetingBar.app"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build/MeetingBar.dmg --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/MeetingBar.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MeetingBar $TAG" \
              --prerelease \
              --notes "$notes"
          fi

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true
